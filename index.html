
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f5f0">
<title>PlanMe</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f5f0;
  color: #243b55;
  min-height: 100vh;
}

button, input { font: inherit; }

button {
  cursor: pointer;
  border: none;
}

.screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.logo {
  font-family: cursive;
  font-size: 65px;
  font-style: italic;
  color: #244c70;
  text-align: center;
}

.subtitle {
  letter-spacing: 5px;
  color: #8998a8;
  text-align: center;
  margin-bottom: 55px;
}

.card {
  background: #fffefa;
  border-radius: 35px;
  padding: 35px 25px;
  width: 100%;
  max-width: 430px;
  text-align: center;
  box-shadow: 0 15px 45px #243b5515;
}

h1 { font-size: 28px; }

p {
  color: #8994a2;
  line-height: 1.7;
}

input {
  width: 100%;
  padding: 17px;
  border: 1px solid #dce2e7;
  border-radius: 15px;
  margin: 12px 0;
  outline-color: #6ca9c5;
}

.primary {
  width: 100%;
  padding: 19px;
  border-radius: 18px;
  background: linear-gradient(120deg,#85bdd0,#467f9e);
  color: white;
  font-size: 18px;
  margin-top: 20px;
}

.hidden { display: none !important; }

#app {
  max-width: 600px;
  margin: auto;
  padding: 25px 18px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.top .logo {
  font-size: 38px;
}

.small {
  background: #e5edf0;
  color: #345b73;
  border-radius: 12px;
  padding: 12px;
}

.calendar {
  background: #fffefa;
  padding: 20px;
  border-radius: 25px;
  box-shadow: 0 10px 30px #243b5510;
}

.month {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.month button {
  background: #eaf1f3;
  padding: 10px 15px;
  border-radius: 10px;
  color: #345b73;
}

.week, .days {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 5px;
  text-align: center;
}

.week div {
  font-size: 12px;
  color: #8994a2;
  padding: 8px 0;
}

.day {
  padding: 12px 0;
  border-radius: 12px;
  background: #f6f6f2;
  color: #34516b;
  min-width: 0;
}

.day.selected {
  background: #83b7ca;
  color: white;
}

.day.today {
  border: 2px solid #83b7ca;
}

.day.has-event::after {
  content: "•";
  display: block;
  color: #e3a77c;
  height: 5px;
}

.section {
  background: #fffefa;
  border-radius: 22px;
  padding: 22px;
  margin-top: 20px;
}

.event {
  background: #eef4f5;
  border-radius: 14px;
  padding: 14px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.event button {
  background: transparent;
  color: #b36d6d;
  padding: 8px;
}

.add {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: #e6f0f2;
  color: #345b73;
  margin-top: 15px;
}

#eventForm {
  margin-top: 15px;
}

.footer {
  text-align: center;
  color: #a0a9b1;
  font-size: 12px;
  padding: 25px;
}
</style>
</head>

<body>

<!-- POWITANIE -->
<div id="welcome" class="screen">
  <div class="logo">PlanMe</div>
  <div class="subtitle">PLAN TOGETHER</div>

  <div class="card">
    <h1>Wszystko w jednym planie</h1>
    <p>Wspólny kalendarz, wspólne wydarzenia i czas zaplanowany razem.</p>
    <button class="primary" onclick="showLogin()">Rozpocznij</button>
  </div>
</div>

<!-- WPISYWANIE IMIENIA -->
<div id="login" class="screen hidden">
  <div class="logo">PlanMe</div>
  <div class="subtitle">PLAN TOGETHER</div>

  <div class="card">
    <h1>Miło Cię poznać! 💙</h1>
    <p>Jak mamy Cię nazywać?</p>
    <input id="username" placeholder="Twoje imię lub pseudonim" maxlength="30">
    <button class="primary" onclick="enterApp()">Wejdź do PlanMe</button>
  </div>
</div>

<!-- APLIKACJA -->
<div id="app" class="hidden">

  <div class="top">
    <div>
      <div class="logo">PlanMe</div>
      <p id="hello" style="margin:0"></p>
    </div>
    <button class="small" onclick="changeName()">Profil ⚙️</button>
  </div>

  <div class="calendar">
    <div class="month">
      <button onclick="moveMonth(-1)">❮</button>
      <h2 id="monthName"></h2>
      <button onclick="moveMonth(1)">❯</button>
    </div>

    <div class="week">
      <div>Pn</div><div>Wt</div><div>Śr</div>
      <div>Cz</div><div>Pt</div><div>Sb</div><div>Nd</div>
    </div>

    <div class="days" id="days"></div>
  </div>

  <div class="section">
    <h2 id="selectedTitle">Wydarzenia</h2>
    <div id="events"></div>

    <button class="add" onclick="toggleForm()">＋ Dodaj wydarzenie</button>

    <div id="eventForm" class="hidden">
      <input id="eventName" placeholder="Nazwa wydarzenia">
      <input id="eventTime" type="time">
      <button class="primary" onclick="saveEvent()">Zapisz wydarzenie</button>
    </div>
  </div>

  <div class="footer">PlanMe 💙 Plan together</div>
</div>

<script>
let user = localStorage.getItem("planme_user") || "";

let current = new Date();
let selected = new Date();

let events = JSON.parse(
  localStorage.getItem("planme_events") || "{}"
);

function showLogin() {
  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

function enterApp() {
  const name = document.getElementById("username").value.trim();

  if (!name) {
    alert("Wpisz swoje imię lub pseudonim 💙");
    return;
  }

  user = name;
  localStorage.setItem("planme_user", user);
  openApp();
}

function openApp() {
  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("hello").textContent =
    "Cześć, " + user + "! 💙";

  render();
}

function changeName() {
  const name = prompt("Jak mamy Cię teraz nazywać?", user);

  if (name && name.trim()) {
    user = name.trim();
    localStorage.setItem("planme_user", user);
    document.getElementById("hello").textContent =
      "Cześć, " + user + "! 💙";
  }
}

function moveMonth(amount) {
  current.setMonth(current.getMonth() + amount);
  render();
}

function key(date) {
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function render() {
  const year = current.getFullYear();
  const month = current.getMonth();

  document.getElementById("monthName").textContent =
    current.toLocaleDateString("pl-PL", {
      month:"long",
      year:"numeric"
    });

  const first = new Date(year,month,1);
  const offset = (first.getDay()+6)%7;
  const count = new Date(year,month+1,0).getDate();

  const container = document.getElementById("days");
  container.innerHTML = "";

  for (let i=0; i<offset; i++) {
    container.innerHTML += "<div></div>";
  }

  for (let d=1; d<=count; d++) {
    const date = new Date(year,month,d);
    const k = key(date);

    const btn = document.createElement("button");
    btn.className = "day";
    btn.textContent = d;

    if (key(selected) === k) btn.classList.add("selected");
    if (key(new Date()) === k) btn.classList.add("today");
    if (events[k]?.length) btn.classList.add("has-event");

    btn.onclick = () => {
      selected = date;
      render();
    };

    container.appendChild(btn);
  }

  showEvents();
}

function showEvents() {
  const k = key(selected);

  document.getElementById("selectedTitle").textContent =
    "Wydarzenia – " + selected.toLocaleDateString("pl-PL");

  const container = document.getElementById("events");
  container.innerHTML = "";

  const list = events[k] || [];

  if (!list.length) {
    container.innerHTML =
      "<p>Na ten dzień nie masz jeszcze planów ✨</p>";
  }

  list.forEach((event,index) => {
    const div = document.createElement("div");
    div.className = "event";

    const info = document.createElement("span");
    info.textContent = (event.time || "Bez godziny") +
      " · " + event.name;

    const remove = document.createElement("button");
    remove.textContent = "Usuń";
    remove.onclick = () => deleteEvent(index);

    div.append(info,remove);
    container.appendChild(div);
  });
}

function toggleForm() {
  document.getElementById("eventForm").classList.toggle("hidden");
}

function saveEvent() {
  const name = document.getElementById("eventName").value.trim();
  const time = document.getElementById("eventTime").value;

  if (!name) {
    alert("Wpisz nazwę wydarzenia!");
    return;
  }

  const k = key(selected);

  if (!events[k]) events[k] = [];

  events[k].push({name,time});

  localStorage.setItem("planme_events",JSON.stringify(events));

  document.getElementById("eventName").value = "";
  document.getElementById("eventTime").value = "";
  document.getElementById("eventForm").classList.add("hidden");

  render();
}

function deleteEvent(index) {
  const k = key(selected);
  events[k].splice(index,1);

  localStorage.setItem("planme_events",JSON.stringify(events));
  render();
}

if (user) {
  openApp();
}
</script>

</body>
</html>
